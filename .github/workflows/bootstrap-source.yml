name: Finalize Rift Warden source

on:
  push:
    paths:
      - 'rift-archive-ready.txt'

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild verified archive and unpack
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -name 'rift-complete-new.b64.part-[0-9][0-9]' | wc -l)" -eq 19
          cp rift-complete-new.b64.part-00.fixed rift-complete-new.b64.part-00
          cp rift-complete-new.b64.part-02.fixed rift-complete-new.b64.part-02
          cp rift-complete-new.b64.part-03.fixed rift-complete-new.b64.part-03
          cat rift-repair-07-a rift-repair-07-b > rift-complete-new.b64.part-07
          cat rift-repair-08-a rift-repair-08-b > rift-complete-new.b64.part-08
          cat rift-repair-09-a rift-repair-09-b > rift-complete-new.b64.part-09
          cat rift-repair-10-a1 rift-repair-10-a2 rift-repair-10-b > rift-complete-new.b64.part-10
          cat rift-repair-17-a rift-repair-17-b > rift-complete-new.b64.part-17
          cat > /tmp/expected-sha256 <<'EOF'
          2a64eb7d791b64102958cb81a609b960683bf0a55aa0f03694385da5f4b4215c  rift-complete-new.b64.part-00
          a2c33ada88b8881dcc4c8c1687ed7bc51f8121d49914fb6332366f44f9719617  rift-complete-new.b64.part-01
          619a4fed433129813576a5a23631195c2f91470acb7c555fba0a821a6698d0d4  rift-complete-new.b64.part-02
          c78ccf2ccb8ea6db3b1f00fdfb3d3e163c6c8fee86ab32bc51f7753303e1db01  rift-complete-new.b64.part-03
          f8b68715638f4a20beb6a509da58d2a26d683a54ecec260b1615f46a37ffaba9  rift-complete-new.b64.part-04
          16da71a143e5804a11c9a7788cbe15e845b91283dde2643276267b5447519f21  rift-complete-new.b64.part-05
          d90a4d537e7eeb957f23c79dc537835000f2ab01640be812b3031dcdda77453b  rift-complete-new.b64.part-06
          9f920f35298501949a1ff3300b7410a83a47d3591d18fe8e95fbda10d5d0f306  rift-complete-new.b64.part-07
          ce6b7685405bc039c23da1aa100e9d07dbb3d4b57cf5140278a2cb5e12db4c39  rift-complete-new.b64.part-08
          c09f1bcdf1325bb423a96a14f9e849f2a4aeed80a2b8ce90b1f94ecc2223b746  rift-complete-new.b64.part-09
          9f0c21c1e84a047effd8ad4f400664e4b487e5df15109311e0582d077600da7b  rift-complete-new.b64.part-10
          695e5cb1ce6266d30ef8db6b5511ac0bdc44b43ddbede900465f78c46760764a  rift-complete-new.b64.part-11
          dcd143bfe01523b04bf5017c9d84640b334d5a70418b239bce70625ad6109510  rift-complete-new.b64.part-12
          eb65157af67c1f8bcdd413ac5493d8c5d24e50602bd53c76c92fd6fe36990f38  rift-complete-new.b64.part-13
          826b286e0db7dfc326237e6e0e043cb48124ea7a78cda44276eeca1af2921981  rift-complete-new.b64.part-14
          b924619df92584cd17e7954207b57757052815fbcc63314bfe23b6bd094cc9d9  rift-complete-new.b64.part-15
          25b3c4f198af1063f68f5e93e0da3628370cee27dcbed19e8e0658d7f12ebfda  rift-complete-new.b64.part-16
          a766ba2d64e03a8923a72cb9fcf257070071b6b298f7660370f58e9f4d5ba17a  rift-complete-new.b64.part-17
          ccaae95e1039320718ec7199888e7c712799dc231dae6576ed9d918a5cb2d010  rift-complete-new.b64.part-18
          EOF
          sha256sum -c /tmp/expected-sha256
          cat rift-complete-new.b64.part-[0-9][0-9] > /tmp/rift-final.b64
          base64 --decode /tmp/rift-final.b64 > /tmp/rift-final.tar.xz
          xz -t /tmp/rift-final.tar.xz
          rm -rf /tmp/rift-unpack && mkdir -p /tmp/rift-unpack
          tar -xJf /tmp/rift-final.tar.xz -C /tmp/rift-unpack
          test -f /tmp/rift-unpack/rift_final/package.json
          test -f /tmp/rift-unpack/rift_final/vercel.json
          test -f /tmp/rift-unpack/rift_final/api/telegram.ts
          test -f /tmp/rift-unpack/rift_final/client/public/rift-radio.html
          cp -a /tmp/rift-unpack/rift_final/. ./

      - name: Apply final launch corrections
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('server/bot.ts')
          s = p.read_text()
          replacements = {
            'timezone: r.timezone || "America/Los_Angeles",': 'timezone: r.timezone || COMMUNITY_TIMEZONE,',
            'timezone: "America/Los_Angeles",\n    status: "trial",': 'timezone: COMMUNITY_TIMEZONE,\n    status: "trial",',
            '`• America/Los_Angeles (Pacific)\\n` +\n        `• America/New_York (Eastern)\\n` +\n        `• Europe/London (GMT/BST)\\n` +\n        `• Australia/Sydney (AEST)\\n` +': '`• Australia/Hobart (Tasmania)\\n` +\n        `• Australia/Sydney (AEST/AEDT)\\n` +\n        `• America/Los_Angeles (Pacific)\\n` +\n        `• America/New_York (Eastern)\\n` +\n        `• Europe/London (GMT/BST)\\n` +',
            '`• America/Los_Angeles (Pacific)\\n` +\n            `• America/New_York (Eastern)\\n` +\n            `• Europe/London (GMT/BST)\\n` +\n            `• Australia/Sydney (AEST)\\n` +\n            `• UTC\\n\\n` +\n            `Type one of the above, or "skip" to use Pacific Time.`': '`• Australia/Hobart (Tasmania)\\n` +\n            `• Australia/Sydney (AEST/AEDT)\\n` +\n            `• America/Los_Angeles (Pacific)\\n` +\n            `• America/New_York (Eastern)\\n` +\n            `• Europe/London (GMT/BST)\\n` +\n            `• UTC\\n\\n` +\n            `Type one of the above, or "skip" to use ${COMMUNITY_TIMEZONE}.`',
            'if (timezone.toLowerCase() === "skip") timezone = "America/Los_Angeles";': 'if (timezone.toLowerCase() === "skip") timezone = COMMUNITY_TIMEZONE;',
            'await ctx.reply("That doesn\'t look like a valid timezone. Try again or type \'skip\' to use Pacific Time.");': 'await ctx.reply(`That doesn\'t look like a valid timezone. Try again or type \'skip\' to use ${COMMUNITY_TIMEZONE}.`);',
            'const timezone = _wizardState.timezone || "America/Los_Angeles";': 'const timezone = _wizardState.timezone || COMMUNITY_TIMEZONE;',
            'const scheduleInfo = `Here\'s when winners are announced (all times Pacific):': 'const scheduleCommunity = await getCommunity(String(chatId));\n      const scheduleTimezone = scheduleCommunity?.timezone || COMMUNITY_TIMEZONE;\n      const scheduleInfo = `Here\'s when winners are announced (all times ${scheduleTimezone}):',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Missing expected launch correction: {old[:90]}')
              s = s.replace(old, new)
          p.write_text(s)
          p = Path('shared/schema.ts')
          s = p.read_text()
          old = 'timezone: text("timezone").default("America/Los_Angeles"),'
          if old not in s:
              raise SystemExit('Missing schema timezone default')
          p.write_text(s.replace(old, 'timezone: text("timezone").default("Australia/Hobart"),'))
          PY
          ! grep -RIn --exclude-dir=node_modules -E 'timezone: r.timezone \|\| "America/Los_Angeles"|timezone: "America/Los_Angeles"|use Pacific Time|all times Pacific' server shared

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate lockfile and validate production build
        shell: bash
        run: |
          set -euo pipefail
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          npm ci --no-audit --no-fund
          npm run check
          npm run build

      - name: Commit clean deployable source
        shell: bash
        run: |
          set -euo pipefail
          rm -f rift-archive-ready.txt
          rm -f rift-complete-new.b64.part-*
          rm -f rift-repair-*
          rm -f rift-final-nolock.tar.xz.b64.part-*
          rm -f rift-final.tar.xz.b64.part-*
          rm -f rift-warden-final.zip.b64.part-*
          rm -f .github/workflows/bootstrap-source.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "Add verified deployable Rift Warden source"
          git push
